name: ooOS validation (isolated branch)
on:
  push:
    branches:
      - ooos-print-preflight-hardening-20261018
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Print ticket smoke test
        run: node tests/printJobTicket.test.mjs
      - name: Next.js production build
        run: npm run build
