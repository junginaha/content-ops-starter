services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jinjoo
      POSTGRES_PASSWORD: jinjoo
      POSTGRES_DB: jinjoo
    ports:
      - '5432:5432'
    volumes:
      - jinjoo_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jinjoo -d jinjoo']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgres://jinjoo:jinjoo@db:5432/jinjoo
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in your .env file}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in your .env file}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      NODE_ENV: production

volumes:
  jinjoo_db_data:
